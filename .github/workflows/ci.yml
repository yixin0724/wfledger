name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflowsim-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-quality-gate:
    name: Full quality gate (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run full quality gate (unit + integration + Javadoc)
        run: mvn -B -Pjavadoc verify

      - name: Set up Python for independent checker self-tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify maintained documentation
        run: |
          python3 -B scripts/test-check-docs.py
          python3 -B scripts/check-docs.py

      - name: Reject credentials and machine-local files before publishing
        run: |
          python3 -B scripts/test-check-upload-safety.py
          python3 -B scripts/check-upload-safety.py

      - name: Verify the tree is maintained in English
        run: |
          python3 -B scripts/test-check-language.py
          python3 -B scripts/check-language.py

      - name: Verify dataset indexes
        run: |
          python3 -B scripts/test-check-dataset-indexes.py
          python3 -B scripts/check-dataset-indexes.py

      - name: Verify study evidence and statistics checker self-tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-study-verifiers.py

      - name: Verify mutation gate self-tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-mutation-gate.py

      - name: Verify energy portrait analysis
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-energy-portrait.py

      - name: Verify network audit self-tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-network-ledger.py

      - name: Generate network ledger producer fixtures
        run: >-
          mvn -B -Pcore-exec -pl :workflowsim -am test-compile exec:java
          -Dexec.mainClass=org.workflowsim.data.NetworkLedgerPythonFixtures
          -Dexec.classpathScope=test
          -Dexec.args="\"$PWD/output/network-ci\""

      - name: Check generated ledgers independently in Python
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from _network_audit import inspect_path
          root = Path('output/network-ci')
          index = json.loads((root / 'fixtures.json').read_text(encoding='utf-8'))
          for name in index['inputs']:
              result = inspect_path(root / name)
              print(json.dumps(dict(input=name, **result), allow_nan=False))
          PY

      - name: Verify V2 lifecycle and context audit self-tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-file-lifecycle.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-file-lifecycle-context.py

      - name: Generate V2 file lifecycle producer fixtures
        run: >-
          mvn -B -Pcore-exec -pl :workflowsim -am test-compile exec:java
          -Dexec.mainClass=org.workflowsim.data.v2.FileLifecyclePythonFixtures
          -Dexec.classpathScope=test
          -Dexec.args="\"$PWD/output/file-lifecycle-ci\""

      - name: Check generated V2 files and bundles independently
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from _network_audit import inspect_path
          root = Path('output/file-lifecycle-ci')
          index = json.loads((root / 'fixtures.json').read_text(encoding='utf-8'))
          for name in index['standalone'] + index['manifests']:
              result = inspect_path(root / name)
              print(json.dumps(dict(input=name, **result), allow_nan=False))
          PY

      - name: Verify V3 storage and context audit self-tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-storage-lifecycle.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-storage-lifecycle-context.py

      - name: Generate V3 storage producer fixtures
        run: >-
          mvn -B -Pcore-exec -pl :workflowsim -am test-compile exec:java
          -Dexec.mainClass=org.workflowsim.data.v2.StorageLifecyclePythonFixtures
          -Dexec.classpathScope=test
          -Dexec.args="\"$PWD/output/storage-lifecycle-ci\""

      - name: Check generated V3 storage files and bundles independently
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from _network_audit import inspect_path
          root = Path('output/storage-lifecycle-ci')
          index = json.loads((root / 'fixtures.json').read_text(encoding='utf-8'))
          for name in index['standalone'] + index['manifests']:
              result = inspect_path(root / name)
              print(json.dumps(dict(input=name, **result), allow_nan=False))
          PY

      - name: Verify online assignment audit self-tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-dataflow-assignment.py

      - name: Verify strict performance comparison tooling
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-dataflow-profile.py

      - name: Generate actual online assignment bundles
        run: >-
          mvn -B -Pcore-exec -pl :workflowsim -am test-compile exec:java
          -Dexec.mainClass=org.workflowsim.data.v2.DataflowAssignmentPythonFixtures
          -Dexec.classpathScope=test
          -Dexec.args="\"$PWD/output/dataflow-assignment-ci\""

      - name: Check online assignment bundles independently
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from _network_audit import inspect_path
          root = Path('output/dataflow-assignment-ci')
          index = json.loads((root / 'fixtures.json').read_text(encoding='utf-8'))
          for name in index['manifests']:
              result = inspect_path(root / name)
              print(json.dumps(dict(input=name, **result), allow_nan=False))
          PY

      - name: Set up Node for offline report checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install pinned report checker and Chromium
        run: |
          npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
          scripts/node_modules/.bin/playwright-core install --with-deps chromium

      - name: Generate real Workbench browser fixtures
        run: >-
          mvn -B -pl :workflowsim-workbench -am test-compile exec:java
          -Dexec.mainClass=org.workflowsim.experiments.workbench.WorkbenchBrowserFixtures
          -Dexec.classpathScope=test
          -Dexec.args="\"$PWD\" \"$PWD/output/workbench-ci\""

      - name: Verify offline reports in Chromium
        run: |
          node scripts/verify-report.cjs output/workbench-ci/browser-fixtures.json output/workbench-ci/screenshots
          node scripts/test-report-checker.cjs output/workbench-ci/browser-fixtures.json

      - name: Preserve quality-gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate-evidence
          retention-days: 7
          path: |
            simulator/target/surefire-reports/
            simulator/target/failsafe-reports/
            experiments/target/surefire-reports/
            experiments/target/failsafe-reports/
            output/workbench-ci/
            output/network-ci/
            output/file-lifecycle-ci/
            output/storage-lifecycle-ci/
            output/dataflow-assignment-ci/

  mutation-gate:
    name: Mutation gate (registered zero-survival battery)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the registered-mutant zero-survival gate (simulator)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/mutation-gate.py --output output/mutation-gate/mutation-gate-ci.json

      - name: Run the registered-mutant zero-survival gate (experiments)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/mutation-gate.py --module experiments --output output/mutation-gate/mutation-gate-experiments-ci.json

      - name: Preserve mutation-gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-gate-evidence
          retention-days: 7
          path: output/mutation-gate/
